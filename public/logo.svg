<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Prompt&amp;Co. logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Search magnifier: brand mark echoing the site logo -->
  <g stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round">
    <circle cx="224" cy="224" r="96"/>
    <line x1="298" y1="298" x2="382" y2="382"/>
  </g>
  <circle cx="224" cy="224" r="30" fill="#a5f3fc" opacity="0.9"/>
  <!-- Wordmark -->
  <text x="384" y="416" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" fill="#ffffff">P&amp;Co.</text>
</svg>